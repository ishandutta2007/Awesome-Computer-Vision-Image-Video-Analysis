<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tag { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.4; }
    }
    
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes scan {
      0% { y: 60px; opacity: 0.2; }
      50% { y: 320px; opacity: 0.8; }
      100% { y: 60px; opacity: 0.2; }
    }

    .anim-pulse { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
    .anim-float1 { animation: float1 5s infinite ease-in-out; }
    .anim-float2 { animation: float2 6s infinite ease-in-out; }
    .anim-scan { animation: scan 4s infinite ease-in-out; }
  </style>

  <!-- Dynamic Background Grid -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>
  
  <g opacity="0.15">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200 M0,350 H1200" stroke="#38bdf8" stroke-width="1"/>
    <path d="M100,0 V400 M200,0 V400 M300,0 V400 M400,0 V400 M500,0 V400 M600,0 V400 M700,0 V400 M800,0 V400 M900,0 V400 M1000,0 V400 M1100,0 V400" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="anim-pulse"/>
  <circle cx="1000" cy="300" r="160" fill="#c084fc" opacity="0.12" filter="url(#glow)" class="anim-pulse"/>

  <!-- Scanning Line Effect -->
  <rect class="anim-scan" x="50" y="60" width="1100" height="2" fill="#38bdf8" filter="url(#glow)" />

  <!-- Bounding Boxes / Dynamic Graphics (Background/Decorative) -->
  <g class="anim-float1" opacity="0.7">
    <!-- Object Detection Box 1 -->
    <rect x="80" y="80" width="160" height="120" rx="6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="80" y="58" width="90" height="22" rx="4" fill="#0284c7"/>
    <text x="88" y="73" class="tag">Object: 0.98</text>
  </g>

  <g class="anim-float2" opacity="0.7">
    <!-- Object Detection Box 2 -->
    <rect x="960" y="210" width="160" height="130" rx="6" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="960" y="188" width="100" height="22" rx="4" fill="#9333ea"/>
    <text x="968" y="203" class="tag">Segmentation</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Icon / Visual Focal Point -->
    <g transform="translate(600, 115)">
      <circle cx="0" cy="0" r="42" fill="url(#accentGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
      <path d="M-15,-5 C-15,-5 -5,-18 0,-18 C5,-18 15,-5 15,-5 C15,-5 5,8 0,8 C-5,8 -15,-5 -15,-5 Z" fill="none" stroke="#ffffff" stroke-width="3" transform="scale(1.5) translate(0, 3)"/>
      <circle cx="0" cy="-2" r="6" fill="#38bdf8"/>
    </g>

    <!-- Main Text -->
    <text x="600" y="220" class="title" filter="url(#glow)">Awesome Computer Vision &amp; Image/Video Analysis</text>
    <text x="600" y="265" class="subtitle">The Ultimate Ecosystem for Vision APIs, Open-Source Models, Segmentation &amp; OCR 🚀</text>

    <!-- Tech Pills -->
    <g transform="translate(600, 320)" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="0" y="4" fill="#38bdf8" text-anchor="middle">Object Detection</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
        <text x="0" y="4" fill="#818cf8" text-anchor="middle">Segmentation</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(80, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
        <text x="0" y="4" fill="#c084fc" text-anchor="middle">OCR &amp; Document</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(240, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
        <text x="0" y="4" fill="#f43f5e" text-anchor="middle">Video Analytics</text>
      </g>
    </g>
  </g>
</svg>
